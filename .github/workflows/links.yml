# Once a month, build the site and check every link in it: papers, press
# coverage, videos, profiles, and the site's own pages. If any link is broken,
# the run fails, so GitHub sends a notice, and the run's summary lists them.
# Email links are not checked (lychee skips them by default). Run it by hand
# from the Actions tab at any time.
name: Check links

on:
  schedule:
    - cron: '17 3 1 * *' # 03:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # Many publishers and profile sites refuse automated requests (403, 406,
      # 429; LinkedIn answers 999) while working fine in a browser, so those
      # codes count as alive. A dead link shows up as 404, 410, or an
      # address that no longer resolves.
      # Optica's journals (and the DOIs that lead there) and SPIE's digital
      # library sit behind bot protection that stalls requests from GitHub's
      # servers until they time out, though the pages work in a browser.
      # They are skipped; DOIs are permanent anyway.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept '200..=299,403,406,429,999'
            --exclude '^https://doi\.org/10\.1364/'
            --exclude '^https://(opg|www)\.optica\.org/'
            --exclude '^https://www\.spiedigitallibrary\.org/'
            --root-dir "${{ github.workspace }}/dist"
            'dist/**/*.html'
          fail: true
