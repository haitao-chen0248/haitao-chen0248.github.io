# Site configuration. Restart `jekyll serve` after editing this file.

# Basic site settings
locale                   : "en-US"
site_theme               : "default" # "default", "air", "sunrise", "mint", "dirt", or "contrast"
title                    : "Haitao Chen"
title_separator          : "-"
name                     : &name "Haitao Chen"
description              : &description "Haitao Chen, PhD candidate in Biomedical Engineering at Duke University. Computational imaging and optical system design."
url                      : https://haitao-chen0248.github.io
baseurl                  : ""
repository               : "haitao-chen0248/haitao-chen0248.github.io"

# Sidebar profile. Blank fields are hidden. See _includes/author-profile.html for all options.
author:
  avatar           : "headshot.jpg"
  name             : "Haitao Chen"
  pronouns         :
  bio              : "PhD Candidate @ Duke BME"
  location         : "Durham, NC"
  employer         :
  uri              :
  email            : "ht.c@duke.edu"
  googlescholar    : "https://scholar.google.com/citations?user=bZp1Yi8AAAAJ"
  orcid            : "https://orcid.org/0000-0001-6730-0989"
  researchgate     : "https://www.researchgate.net/profile/Haitao-Chen-15"
  github           : "haitao-chen0248"
  linkedin         : "haitao-chen-b569a5285"

# Site settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : false
atom_feed:
  hide                   : true

# SEO
google_site_verification :
bing_site_verification   :

# Social sharing
twitter:
  username               :
og_image                 : "headshot.jpg"
og_description           : *description
social:
  type                   : Person
  name                   : *name
  links:
    - "https://github.com/haitao-chen0248"
    - "https://www.linkedin.com/in/haitao-chen-b569a5285"
    - "https://scholar.google.com/citations?user=bZp1Yi8AAAAJ"
    - "https://orcid.org/0000-0001-6730-0989"

# Analytics
analytics:
  provider               : false # "google-analytics-4" to enable
  google:
    tracking_id          :

# Reading files
include:
  - .htaccess
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: America/New_York

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# HTML compression
compress_html:
  clippings: all
  ignore:
    envs: development
